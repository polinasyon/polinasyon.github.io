name: Tailwind CSS Derle ve Yayınla

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Node.js Kur
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Tailwind v4 Kurulumu ve Derleme
        run: |
          npm install -D tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./input.css -o ./style.css --minify

      - name: Derlenen CSS'i Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add style.css
          git commit -m "Tailwind v4 otomatik derleme" || echo "Değişiklik yok"
          git push
