name: Tailwind CSS Derle ve Yayınla

on:
  push:
    branches: [ "main" ] # Deponun ana dalı main ise bu kalır, master ise master yapın.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Node.js Kur
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Tailwind Kurulumu ve Derleme
        run: |
          npm install -D tailwindcss
          npx tailwindcss -i ./input.css -o ./style.css --minify
          
      - name: Derlenen CSS'i Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add style.css
          git commit -m "Tailwind otomatik derlemesi (v4.0)" || echo "Değişiklik yok"
          git push
